name: Publish Docker Hub images

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version tag, for example 1.0.0
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: payments-api
            context: services/payments-api
          - name: audit-api
            context: services/audit-api
          - name: console
            context: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Authenticate to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and publish immutable image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          provenance: mode=max
          sbom: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/bankpulse-${{ matrix.name }}:${{ inputs.version }}
            ${{ secrets.DOCKERHUB_USERNAME }}/bankpulse-${{ matrix.name }}:latest
