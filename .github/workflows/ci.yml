name: BankPulse Release Gate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bankpulse-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-test:
    name: Build y Unit Tests (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [payments-api, audit-api]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: services/${{ matrix.service }}/pom.xml
      - name: Compilar y ejecutar pruebas unitarias
        run: mvn --batch-mode --no-transfer-progress -f services/${{ matrix.service }}/pom.xml verify
      - name: Conservar resultados de pruebas unitarias
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-tests-${{ matrix.service }}-${{ github.run_id }}
          path: services/${{ matrix.service }}/target/surefire-reports/
          if-no-files-found: ignore

  release-gate:
    name: Release Gate
    needs: build-test
    # Un gate requerido no debe quedar omitido cuando falla un prerrequisito.
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Exigir compilacion y pruebas exitosas
        env:
          BUILD_RESULT: ${{ needs.build-test.result }}
        run: test "$BUILD_RESULT" = success
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Docker Build
        run: docker compose build
      - name: Deploy Lab
        run: docker compose up -d --wait --wait-timeout 360
      - name: Smoke tecnico - servicios UP y HTTP 200
        id: technical
        run: python3 scripts/technical_smoke.py
      - name: Business Test - dos solicitudes, un pago de USD 500
        id: business
        run: python3 scripts/business_gate.py
      - name: Capturar diagnostico
        if: always()
        run: |
          mkdir -p evidence
          docker compose ps --all > evidence/containers.txt 2>&1 || true
          docker compose logs --no-color --tail=250 > evidence/compose.log 2>&1 || true
      - name: Resumen PASS o BLOCK
        if: always()
        env:
          BUILD_RESULT: ${{ needs.build-test.result }}
          TECHNICAL_RESULT: ${{ steps.technical.outcome }}
          BUSINESS_RESULT: ${{ steps.business.outcome }}
        run: |
          {
            echo '## BANKPULSE Release Gate'
            echo "Build y Unit Tests: $BUILD_RESULT"
            echo "Smoke tecnico: $TECHNICAL_RESULT"
            echo "Business Test: $BUSINESS_RESULT"
            if [ "$BUILD_RESULT" = success ] && [ "$TECHNICAL_RESULT" = success ] && [ "$BUSINESS_RESULT" = success ]; then
              echo '### RELEASE PASS'
            else
              echo '### RELEASE BLOCKED'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Guardar evidencia incluso cuando el negocio falla
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-gate-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/
          retention-days: 30
          if-no-files-found: warn
      - name: Detener laboratorio efimero de CI
        if: always()
        run: docker compose down -v
