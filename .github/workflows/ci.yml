name: BankPulse CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  integration-test:
    name: Release Gate
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Descargar codigo del repositorio
        uses: actions/checkout@v6.1.0

      - name: Configurar Java 21
        uses: actions/setup-java@v6.1.0
        with:
          distribution: zulu
          java-version: '21'
          cache: maven
          cache-dependency-path: 'services/**/pom.xml'

      - name: Build - compilar servicios
        run: |
          mvn -B -f services/payments-api/pom.xml compile
          mvn -B -f services/audit-api/pom.xml compile

      - name: Unit Tests - validar solicitudes de pago
        run: mvn -B -f services/payments-api/pom.xml -Dtest=PaymentRequestValidationTest test

      - name: Docker Build
        run: docker compose build

      - name: Deploy Lab
        run: docker compose up -d --wait --wait-timeout 360

      - name: Technical Smoke - disponibilidad
        run: bash scripts/technical-smoke.sh

      - name: Business Test - un solo pago
        run: bash scripts/business-test.sh

      - name: Mostrar diagnostico si falla
        if: failure()
        run: |
          docker compose ps --all
          docker compose logs --no-color --tail=250

      - name: Detener laboratorio
        if: always()
        run: docker compose down -v